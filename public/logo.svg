<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9F5" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050B16" stop-opacity="0" />
    </radialGradient>

    <!-- Main Metallic Cyber Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="neonIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9F5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows / Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Core -->
  <circle cx="80" cy="80" r="74" fill="url(#bgGlow)" />

  <!-- Outer Protective Cyber Ring -->
  <circle cx="80" cy="80" r="72" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="8 6 18 6" opacity="0.85" />
  <circle cx="80" cy="80" r="66" stroke="#00D9F5" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Mathematical Coordinate Points (Cardinal Axis Marks) -->
  <circle cx="80" cy="8" r="2.2" fill="#00D9F5" filter="url(#glowFilter)" />
  <circle cx="152" cy="80" r="2.2" fill="#00D9F5" filter="url(#glowFilter)" />
  <circle cx="80" cy="152" r="2.2" fill="#3B82F6" filter="url(#glowFilter)" />
  <circle cx="8" cy="80" r="2.2" fill="#6366F1" filter="url(#glowFilter)" />

  <!-- Golden Ratio Spiral Arc & Hyperbolic Geometry -->
  <path d="M 80 80 A 12 12 0 0 1 92 80 A 24 24 0 0 1 80 104 A 44 44 0 0 1 36 80 A 70 70 0 0 1 80 10" 
        fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.45" stroke-dasharray="3 3" />

  <!-- Geometric Triangle Grid Matrix in Background (Sacred Math Delta) -->
  <polygon points="80,24 130,116 30,116" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <polygon points="80,136 130,44 30,44" fill="none" stroke="#818CF8" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- Central Mathematical Emblem: Stylized High-Tech Sigma (∑) -->
  <g filter="url(#glowFilter)">
    <!-- Sigma Body Shadow/Backplate for 3D Depth -->
    <path d="M 112 44 L 54 44 L 84 80 L 54 116 L 112 116 L 112 104 L 78 104 L 98 80 L 78 56 L 112 56 Z" 
          fill="#050B16" fill-opacity="0.7" stroke="#00D9F5" stroke-opacity="0.3" stroke-width="4" stroke-linejoin="round" />

    <!-- Main Front Faceted Sigma -->
    <path d="M 112 44 L 54 44 L 84 80 L 54 116 L 112 116 L 112 104 L 78 104 L 98 80 L 78 56 L 112 56 Z" 
          fill="url(#cyberCyan)" />

    <!-- Sharp Top Accent Flare -->
    <polygon points="54,44 112,44 104,50 64,50" fill="#FFFFFF" fill-opacity="0.75" />
    
    <!-- Sharp Central Diagonal Crest -->
    <polygon points="84,80 98,80 78,56 68,60" fill="url(#neonIndigo)" fill-opacity="0.9" />

    <!-- Bottom Accent Shelf -->
    <polygon points="54,116 112,116 104,110 64,110" fill="#3B82F6" fill-opacity="0.8" />
  </g>

  <!-- Glowing Corner Sparks -->
  <circle cx="112" cy="44" r="2.5" fill="#FFFFFF" filter="url(#intenseGlow)" />
  <circle cx="112" cy="116" r="2.5" fill="#00D9F5" filter="url(#intenseGlow)" />
  <circle cx="84" cy="80" r="3" fill="#FFFFFF" filter="url(#intenseGlow)" />
</svg>
